<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Threadbase</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; color: #1e293b; }
      .badge {
        position: absolute; top: -6px; right: -6px;
        background: #ef4444; color: #fff;
        font-size: 0.65rem; font-weight: 700;
        min-width: 18px; height: 18px;
        border-radius: 9px; padding: 0 4px;
        display: flex; align-items: center; justify-content: center;
        pointer-events: none;
      }
      .notification-item { padding: 0.75rem 1rem; border-bottom: 1px solid #e2e8f0; cursor: pointer; }
      .notification-item.unread { background: #eff6ff; }
      .notification-item.read   { background: #fff; color: #64748b; }
      .notification-item:hover  { background: #f1f5f9; }
      .dropdown {
        position: absolute; right: 0; top: calc(100% + 8px);
        width: 320px; background: #fff;
        border: 1px solid #e2e8f0; border-radius: 10px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        z-index: 100; overflow: hidden;
      }
      .dropdown-header { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; border-bottom: 1px solid #e2e8f0; font-weight: 600; font-size: 0.9rem; }
      .dropdown-header button { font-size: 0.75rem; background: none; border: none; color: #6366f1; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
